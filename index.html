<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glam - Customer Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink-primary: #FF9EC9;
            --pink-light: #FFB8D9;
            --pink-dark: #E85D9B;
            --gold: #D4AF37;
            --gold-light: #F4D47B;
            --white: #FFFFFF;
            --black: #2C1810;
            --grey: #F8F5F2;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #FFF5FA 0%, #FFE8F0 50%, #FFF 100%);
            min-height: 100vh;
            color: var(--black);
            overflow-x: hidden;
        }

        .watercolor-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(255, 158, 201, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 184, 217, 0.1) 0%, transparent 60%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .logo-section {
            text-align: center;
            padding: 40px 20px 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-frame {
            display: inline-block;
            padding: 8px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.3);
        }

        .logo-inner {
            background: white;
            border-radius: 15px;
            padding: 15px;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-watercolor {
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(135deg, var(--pink-primary) 0%, var(--pink-light) 100%);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .logo-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }

        .logo-main {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 700;
            font-style: italic;
            color: var(--black);
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
            line-height: 1;
            margin-bottom: 5px;
        }

        .logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--black);
            opacity: 0.8;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px 25px;
            margin: 20px 0;
            box-shadow: 0 10px 40px rgba(255, 158, 201, 0.2);
            border: 2px solid var(--gold);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .customer-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--pink-dark);
            text-align: center;
            margin-bottom: 15px;
        }

        .customer-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--black);
            opacity: 0.6;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--pink-primary) 0%, var(--pink-light) 100%);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            pointer-events: none;
        }

        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.95;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--pink-dark);
            margin: 35px 0 20px;
            padding-left: 10px;
            border-left: 4px solid var(--gold);
            animation: fadeInLeft 0.8s ease-out 0.4s both;
        }

        .offer-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid var(--pink-light);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .offer-card:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 25px rgba(255, 158, 201, 0.25);
        }

        .offer-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .offer-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--black);
            margin-bottom: 8px;
            padding-right: 80px;
        }

        .offer-description {
            font-size: 14px;
            color: var(--black);
            opacity: 0.7;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .offer-expiry {
            font-size: 12px;
            color: var(--pink-dark);
            font-weight: 500;
        }

        .payment-history {
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .payment-item {
            background: white;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .payment-details {
            flex: 1;
        }

        .payment-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--black);
            margin-bottom: 4px;
        }

        .payment-service {
            font-size: 12px;
            color: var(--black);
            opacity: 0.6;
        }

        .payment-amount {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--pink-dark);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--pink-light);
            border-top: 4px solid var(--pink-dark);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            font-size: 16px;
            color: var(--black);
            opacity: 0.6;
        }

        .error-card {
            background: white;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            border: 2px solid #FFB8D9;
            margin: 40px 0;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .error-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--pink-dark);
            margin-bottom: 10px;
        }

        .error-message {
            font-size: 14px;
            color: var(--black);
            opacity: 0.7;
            line-height: 1.6;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            opacity: 0.6;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .empty-text {
            font-size: 14px;
            color: var(--black);
        }
    </style>
</head>
<body>
    <div class="watercolor-bg"></div>
    
    <div class="container">
        <div class="logo-section">
            <div class="logo-frame">
                <div class="logo-inner">
                    <div class="logo-watercolor">
                        <div class="logo-text">
                            <div class="logo-main">The Glam</div>
                            <div class="logo-sub">NAIL BAR</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading your profile...</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration - Replace with your Google Sheets Web App URL
        const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbysZiMeK8OsKBMc1Mq5uYOLRyJb9CpBg8DdDnUlFXWGFOTJM-Rm2q4stjSOzYQvkHfyXw/exec';

        // Get customer ID from URL parameter
        function getCustomerIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || urlParams.get('customer');
        }

        // Load customer data
        async function loadCustomerData() {
            const customerId = getCustomerIdFromUrl();
            
            if (!customerId) {
                showError('No customer ID provided', 'Please scan your NFC keychain to access your profile.');
                return;
            }

            try {
                const response = await fetch(`${SHEETS_API_URL}?action=getCustomer&id=${customerId}`);
                const data = await response.json();

                if (data.error) {
                    showError('Customer Not Found', data.error);
                    return;
                }

                displayCustomerData(data);
            } catch (error) {
                showError('Connection Error', 'Unable to load your data. Please check your internet connection.');
                console.error('Error:', error);
            }
        }

        function displayCustomerData(data) {
            const content = document.getElementById('content');
            
            let html = `
                <div class="welcome-card">
                    <div class="customer-name">${data.name}</div>
                    <div class="customer-subtitle">Customer ID: ${data.id}</div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${data.sessionsRemaining || 0}</div>
                            <div class="stat-label">Sessions Left</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.sessionsCompleted || 0}</div>
                            <div class="stat-label">Completed</div>
                        </div>
                    </div>
                </div>
            `;

            // Special Offers
            if (data.offers && data.offers.length > 0) {
                html += `<div class="section-title">✨ Special Offers for You</div>`;
                data.offers.forEach(offer => {
                    html += `
                        <div class="offer-card">
                            <div class="offer-badge">${offer.discount || 'Special'}</div>
                            <div class="offer-title">${offer.title}</div>
                            <div class="offer-description">${offer.description}</div>
                            ${offer.expiry ? `<div class="offer-expiry">Valid until: ${offer.expiry}</div>` : ''}
                        </div>
                    `;
                });
            }

            // Payment History
            if (data.payments && data.payments.length > 0) {
                html += `<div class="section-title">💳 Payment History</div>`;
                html += `<div class="payment-history">`;
                data.payments.forEach(payment => {
                    html += `
                        <div class="payment-item">
                            <div class="payment-details">
                                <div class="payment-date">${payment.date}</div>
                                <div class="payment-service">${payment.service || 'Service'}</div>
                            </div>
                            <div class="payment-amount">€${payment.amount}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            } else {
                html += `
                    <div class="section-title">💳 Payment History</div>
                    <div class="empty-state">
                        <div class="empty-icon">💫</div>
                        <div class="empty-text">No payment history yet</div>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        function showError(title, message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="error-card">
                    <div class="error-icon">💅</div>
                    <div class="error-title">${title}</div>
                    <div class="error-message">${message}</div>
                </div>
            `;
        }

        // Load data on page load
        window.addEventListener('DOMContentLoaded', loadCustomerData);
    </script>
</body>
</html>
